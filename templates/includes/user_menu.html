{% load static %}

<aside class="col-lg-2">
    
    <div class="offcanvas-lg offcanvas-start pe-lg-0 pe-xl-4" id="accountSidebar">
        <div class="offcanvas-header d-lg-block py-3 p-lg-0">
            <div class="d-flex align-items-center">
                <div class="min-w-0 ps-3">
                     <div class="ratio ratio-1x1 border rounded-circle overflow-hidden d-none d-lg-block" style="width: 86px">
                    <img src="/media/{{request.user.profile}}"  alt="Avatar">
                  </div>
                    <h5 class="h6 mb-1 mt-3">{{request.user}}</h5>
                    <div class="nav flex-nowrap text-nowrap min-w-0">
                        <a class="nav-link animate-underline text-body p-0" href="#bonusesModal"
                            data-bs-toggle="modal">
                            <span class="animate-target me-1">{{request.user.email}}</span>
                        </a>
                    </div>
                </div>
            </div>
            <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas"
                data-bs-target="#accountSidebar" aria-label="Close"></button>
        </div>

        <!-- Body (Navigation) -->
        <div class="offcanvas-body d-block   pt-lg-4 pb-lg-0">
        <h6 class="pt-4 ps-2 ms-1">Ticket Bookings</h6>
        <nav class="list-group list-group-borderless">
           
             <a class="list-group-item list-group-item-action d-flex align-items-center"  href="/user/">
                    <i class="ci-shopping-bag fs-base opacity-75 me-2"></i>
                   Ticket Booking
                </a>
             
        </nav>
      
           
 
        </div>
               {%if request.user.is_admin %}
         <h6 class="pt-4 ps-2 ms-1">Your Shows</h6>
        <nav class="list-group list-group-borderless">
            <a class="list-group-item list-group-item-action d-flex align-items-center" pe-none " href="/user/movies/">
                    <i class="ci-film fs-base opacity-75 me-2"></i>
                    Movies
                </a>
            <a class="list-group-item list-group-item-action d-flex align-items-center" href="/user/events/">
            <i class="ci-gift fs-base opacity-75 me-2"></i>
            Events
            </a>
             
        </nav>
        {%endif%}
         <h6 class="pt-4 ps-2 ms-1">Manage account</h6>
        <nav class="list-group list-group-borderless">
                {%if request.user.is_admin %}
            <a class="list-group-item list-group-item-action d-flex align-items-center" href="/user/updateinfo/">
            <i class="ci-user fs-base opacity-75 me-2"></i>
           Update info
            </a>
            <a class="list-group-item list-group-item-action d-flex align-items-center" href="/user/events/">
            <i class="ci-map-pin fs-base opacity-75 me-2"></i>
             Bank Account
            </a>
            <a class="list-group-item list-group-item-action d-flex align-items-center" href="/user/events/">
            <i class="ci-bell fs-base opacity-75 mt-1 me-2"></i>
            Change Password
            </a>
            {%endif%}
             <a class="list-group-item list-group-item-action d-flex align-items-center"
                    href="/user/logout">
                    <i class="ci-log-out fs-base opacity-75 me-2"></i>
                    Log out
                </a>
        </nav>
    </div>
    
</aside>
