{% extends "../includes/user_base.html" %}
{% block content %}
<div  >
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} mt-2">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    <h4 class="alert-heading ">
        Update your Information
    </h4>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{form}}
        <div class="mt-3">
        <button type="submit" class="btn btn-md btn-danger"><i class="ci-edit"></i> &nbsp;Update info &nbsp;<i class="ci-chevron-right"></i></button>
        </div>
    </form>

</div>
{% endblock %}
