{% extends "../includes/base.html" %}
{% load static %}
{% block content %}
<div class="container p-5">
<h3>Password reset</h3>

<p>Forgotten your password? Enter your email address below, and we’ll email instructions for setting a new one.</p>

<form method="post">
    <h5>Enter Email</h5>
	{% csrf_token %}
	{{form.email}}
	<input type="Submit" name="Send email" value="Request for Reset" class="btn btn-primary  btn-sm">

</form>
</div>

{% endblock content %}
