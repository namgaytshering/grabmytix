<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ film.title }}</title>
    <style>
        .container {
            max-width: 100%;
            margin: auto;
            font-family: Arial, sans-serif;
            border: 10x solid #eee;
            padding: 10px;
            border-radius: 10px;
        }

        .poster {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
        }

        .btn {
            display: inline-block;
            width: 90%;
            margin-top: 15px;
            padding: 10px 20px;
            background: #e50914;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #b00610;
        }

         .btn-sub {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #f2f0f0;
            color: #616060;
            text-decoration: none;
            border-radius: 6px;
        }

       
    </style>
</head>

<body>

<div class="container">

    <img
    src="https://www.grabmytix.com/{{ film.poster_image.url }}"
    class="poster"
    alt="{{ film.title }}"
    width="300"
    height="450"
    style="display:block; width:100%; max-width:300px; height:auto;">
    
    <h2>Screening {{ film.title }}</h2>
    <p>{{ message|safe  }}</p>
<center>
    <a href="https://www.grabmytix.com/{{ film.slug }}" class="btn">
         Grab a Ticket
    </a>

    </center>
</div>
 

</body>
</html>
